name: Update DevPortal Documentation

env:
  DEV_PORTAL_SCRIPT_PATH: ".github/workflows/scripts/devportal-update"

on:
  push:
    paths:
      - "docs/**"
      - "doc/rpc/**"
    branches:
      - master
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'  # You can specify the Python version you prefer

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML
          chmod -R +x ${{ env.DEV_PORTAL_SCRIPT_PATH }}/process_docs.py

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 #v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract version from gradle.properties
        run: |
          VERSION=$(tr -d "'\"" < rskj-core/src/main/resources/version.properties | cut -d = -f 2- | paste -sd - -)
          echo "RSK_VERSION=${VERSION}" >> $GITHUB_ENV

      # The Gradle wrapper jar is not checked in; configure.sh fetches and hash-verifies it.
      - name: Generate the OpenRPC document
        run: |
          ./configure.sh
          ./gradlew --no-daemon :rskj-core:genRpcDocs -PrpcDocVersion="${{ env.RSK_VERSION }}"

      # Step 1: Generate GitHub App Token
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: rsksmart
          repositories: devportal

      # Step 2: Clone the Devportal Repository and create branch
      - name: Clone Devportal Repository
        run: |
          BRANCH_NAME="update-from-rskj-${{ env.RSK_VERSION }}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

          git clone https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/rsksmart/devportal.git
          cd devportal
          git checkout -b ${BRANCH_NAME} || git checkout ${BRANCH_NAME}
          cd ..

      # Step 3: Transform Each File and Copy to DevPortal Repository
      - name: Transform Files for DevPortal
        run: |
          mkdir -p transformed
          
          # Process other documentation files
          python ${{ env.DEV_PORTAL_SCRIPT_PATH }}/process_docs.py ${{ env.DEV_PORTAL_SCRIPT_PATH }}/doc_config.yaml

          # Copy processed files to devportal directory
          cp -R transformed/* devportal/docs/

          # Docusaurus serves static/ verbatim, so the OpenRPC document is fetchable at a stable
          # URL whether or not a renderer consumes it.
          mkdir -p devportal/static/openrpc
          cp rskj-core/build/rpc-docs/rskj-openrpc.json devportal/static/openrpc/rskj-openrpc.json

      # Step 4: Commit Changes in the DevPortal Repository
      # This step is the single place that decides whether this run has anything to publish.
      # Everything downstream (push, pull request, success message) keys off `changed`.
      - name: Commit Changes
        id: commit
        run: |
          cd devportal
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs static/openrpc
          # A run whose inputs produced no change must not fail the job on `git commit`,
          # and must not push a branch or open a pull request either.
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish: devportal already matches this rskj revision."
          else
            git commit -m "Automated update from rskj repository"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 5: Push the Branch to the DevPortal Repository
      - name: Push Changes
        id: push
        if: steps.commit.outputs.changed == 'true'
        run: |
          cd devportal
          git remote set-url origin https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/rsksmart/devportal.git
          echo "Pushing branch: ${{ env.BRANCH_NAME }}"
          git push -u -f origin ${{ env.BRANCH_NAME }}
          # Recorded so the next step can confirm a pull request carries *this* commit,
          # rather than merely existing on the same branch.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Step 6: Create a Pull Request in the DevPortal Repository
      # The success message is printed only after the API has confirmed a pull request that
      # carries this change -- either one just created, or one already open on this branch,
      # which the force-push above has just updated. Every other refusal fails the job.
      - name: Create Pull Request
        if: steps.commit.outputs.changed == 'true'
        run: |
          PR_RESPONSE=$(curl -sS -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.generate_token.outputs.token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -w '\n%{http_code}' \
          https://api.github.com/repos/rsksmart/devportal/pulls \
          -d '{
            "title": "Automated update of documentation for RSKj node - '"${{ env.BRANCH_NAME }}"'",
            "body": "This PR updates the Devportal documentation with the latest changes from the original repository.\n\nOriginal RSKj PR: https://github.com/rsksmart/rskj/pull/${{ github.event.pull_request.number }}",
            "head": "'"${{ env.BRANCH_NAME }}"'",
            "base": "main"
          }')

          HTTP_CODE=$(printf '%s' "$PR_RESPONSE" | tail -n 1)
          BODY=$(printf '%s' "$PR_RESPONSE" | sed '$d')
          echo "Response (HTTP ${HTTP_CODE}): ${BODY}"

          if [ "$HTTP_CODE" = "201" ]; then
            PR_URL=$(printf '%s' "$BODY" | jq -r '.html_url // empty' 2>/dev/null || true)
            if [ -z "$PR_URL" ]; then
              echo "::error::The pull request API returned HTTP 201 without a pull request URL."
              exit 1
            fi

            echo "Pull request created successfully: ${PR_URL}"
            exit 0
          fi

          # No pull request was created, which is not the same as nothing being published: the
          # push above is a force-push and ran before this step, and a pull request tracks its
          # head branch. So if one is open on this branch and its head is the commit just
          # pushed, it carries this change and the run succeeded. That is asked of the API
          # rather than read out of the refusal -- 422 also covers "No commits between", an
          # invalid base and a malformed head, and the error prose is GitHub's to reword.
          #
          # Existence alone is not enough, and this is the trap the branch name sets: it follows
          # version.properties and so outlives a whole release cycle. If creation broke for good
          # -- a dropped pull_requests permission, a payload the API stops accepting -- an
          # existence test would find last cycle's pull request every run, report success, and
          # leave the force-push rewriting a branch under a pull request nobody is watching.
          # Matching the head commit is what separates that from a genuine update.
          EXISTING_RESPONSE=$(curl -sS -L -G \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.generate_token.outputs.token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -w '\n%{http_code}' \
          https://api.github.com/repos/rsksmart/devportal/pulls \
          --data-urlencode "head=rsksmart:${{ env.BRANCH_NAME }}" \
          --data-urlencode "base=main" \
          --data-urlencode "state=open")

          EXISTING_CODE=$(printf '%s' "$EXISTING_RESPONSE" | tail -n 1)
          EXISTING_BODY=$(printf '%s' "$EXISTING_RESPONSE" | sed '$d')

          if [ "$EXISTING_CODE" = "200" ]; then
            # Tolerant of a 200 that is not the expected array and of one that is not JSON at
            # all -- a proxy interstitial, a truncated body -- so an unexpected shape falls
            # through to the error below, which prints it, rather than killing the step on a
            # raw jq message that says none of that.
            PR_URL=$(printf '%s' "$EXISTING_BODY" \
              | jq -r --arg sha "${{ steps.push.outputs.sha }}" \
                'if type == "array" then (map(select(.head.sha == $sha)) | .[0].html_url // empty) else empty end' \
              2>/dev/null || true)
            if [ -n "$PR_URL" ]; then
              echo "A pull request was already open for ${{ env.BRANCH_NAME }}; the push updated it: ${PR_URL}"
              exit 0
            fi
          fi

          echo "::error::The pull request API refused the request (HTTP ${HTTP_CODE}) and no open pull request onto main carries ${{ steps.push.outputs.sha }} from ${{ env.BRANCH_NAME }} (lookup HTTP ${EXISTING_CODE}); nothing was published."
          echo "Lookup response: ${EXISTING_BODY}"
          exit 1
