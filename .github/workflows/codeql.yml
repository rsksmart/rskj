name: "CodeQL"

on:
  push:
    branches: [ "master", "*-rc" ]
  pull_request:
    branches: [ "master", "*-rc" ]
  schedule:
    - cron: "0 0 * * *"

# Declare default permissions as read only.
permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python, java ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Java JDK
        if: ${{ matrix.language == 'java' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 #v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Before Index (java)
        if: ${{ matrix.language == 'java' }}
        run: ./configure.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd #v3.29.5
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 #v3.29.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd #v3.29.5
        with:
          category: "/language:${{ matrix.language }}"
