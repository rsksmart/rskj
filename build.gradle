plugins {
    id "org.sonarqube" version "5.1.0.4882"
}

sonar {
    properties {
        property "sonar.projectKey", "rskj"
        property "sonar.organization", "rsksmart"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.junit.reportPaths", "rskj-core/build/test-results/"
        property "sonar.coverage.jacoco.xmlReportPaths", "rskj-core/build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

subprojects {
    def config = new ConfigSlurper().parse(file("$projectDir/src/main/resources/version.properties").toURI().toURL())
    group = 'co.rsk'
    version = config.modifier?.trim() ? config.versionNumber + "-" + config.modifier : config.versionNumber
}

allprojects {
    apply from: rootProject.file('gradle/dependency-resolution.gradle')
}

tasks.register('resolveAllDependencies') {
    group = 'Build Setup'
    description = 'Downloads every resolvable dependency of every project into the Gradle cache'

    // Deferred with a closure: subprojects are not configured yet while this block runs, so the
    // list of tasks to depend on cannot be built here.
    dependsOn { allprojects.collect { target -> target.tasks.named('resolveDependencies') } }
}
