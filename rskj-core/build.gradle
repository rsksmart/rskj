plugins {
    id 'application'
    id 'checkstyle'
    id "com.diffplug.spotless" version "6.13.0"
    id 'java'
}

apply from: 'src/fuzzTest/fuzzing.gradle'
apply plugin: 'maven-publish'
apply plugin: 'jacoco'

import java.nio.file.Paths
import groovy.transform.Field

checkstyle {
    toolVersion = '12.2.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

spotless {
    // Wire spotlessJavaCheck into the `check` lifecycle task (and hence `./gradlew build`),
    // so it actually runs instead of silently being a no-op the ratchet plumbing sets up but
    // never invokes. Already passes clean unratcheted against the whole tree.
    enforceCheck true
    java {
        // Only check for newline at end of file
        endWithNewline()
        // Enable ratchet mode to only check files changed from the target branch
        if (project.hasProperty('ratchetFrom')) {
            ratchetFrom project.property('ratchetFrom')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'co.rsk.Start'
    applicationDefaultJvmArgs = ["-server", "-Xss32m", "-Xms3G", "-Xmx8G",
    "-XX:+UseCompressedOops", "-XX:-OmitStackTraceInFastThrow"
    ]
}

tasks.named('run', JavaExec) {
    // This allows you to change logging level like this
    // ./gradlew run --args='--regtest' -Plogging.stdout=WARN
    if (project.hasProperty('logging.stdout')) {
        systemProperty('logging.stdout', project.property('logging.stdout'));
    } else {
        systemProperty('logging.stdout', 'INFO');
    }
 }

// Returns the list of changed *.java files relative to the 'ratchetFrom' project property
// (e.g. -PratchetFrom=origin/master), unioned with any uncommitted/staged local changes, or
// null when 'ratchetFrom' isn't provided -- meaning "no ratchet: check the full source set".
//
// This mirrors the ratchetFrom pattern Spotless already uses in this file, instead of
// approximating "changed files" via `git log --since=<a fixed date>`, whose result silently
// depends on how much git history the checkout has (e.g. a shallow CI clone sees every file in
// its single commit as "added", while a full local clone only sees files touched since that
// date) rather than on what the current branch/PR actually changed.
// Runs a git command, keeping stderr separate from stdout. Fails loudly (GradleException) on
// a non-zero exit instead of silently swallowing the error, so a bad/unfetched ratchetFrom ref
// fails the build with a clear message, rather than producing an empty file list that reads as
// "nothing changed" and silently disables the check.
def runGit(List<String> command) {
    def out = new ByteArrayOutputStream()
    def err = new ByteArrayOutputStream()
    def result = exec {
        commandLine command
        standardOutput = out
        errorOutput = err
        ignoreExitValue = true
    }
    if (result.exitValue != 0) {
        throw new GradleException(
                "Cannot determine the ratcheted file set: '${command.join(' ')}' exited " +
                "${result.exitValue}. This usually means the -PratchetFrom ref isn't available " +
                "locally (e.g. the base branch wasn't fetched, or the ref is invalid).\nstderr:\n${err}"
        )
    }
    return out.toString()
}

// getFilteredFilesForCheckstyle() below is called once per Checkstyle task (main, test,
// integrationTest, jmh, fuzzTest, file) during configureEach, and again for
// jmh/integrationTest/fuzzTest in the afterEvaluate block further down -- each call would
// otherwise re-run the 3 git subprocesses above from scratch. The git diff state can't change
// mid-build, so it's safe to compute this once per build invocation and cache it.
@Field def ratchetedFilesComputed = false
@Field def ratchetedFilesCache = null

def getRatchetedFiles() {
    if (ratchetedFilesComputed) {
        return ratchetedFilesCache
    }
    ratchetedFilesComputed = true

    if (!project.hasProperty('ratchetFrom')) {
        return ratchetedFilesCache = null
    }

    def ratchetFrom = project.property('ratchetFrom')

    def baseDiffOutput = runGit(['git', 'diff', '--name-only', "${ratchetFrom}...HEAD"])
    def uncommittedOutput = runGit(['git', 'diff', '--name-only'])
    def stagedOutput = runGit(['git', 'diff', '--cached', '--name-only'])

    def baseDiffFiles = baseDiffOutput.trim().split('\n').toList()
    def uncommittedFiles = uncommittedOutput.trim().split('\n').toList()
    def stagedFiles = stagedOutput.trim().split('\n').toList()
    def allFiles = (baseDiffFiles + uncommittedFiles + stagedFiles).unique().findAll { file -> file }

    def projectRoot = project.projectDir.toPath().toAbsolutePath()

    allFiles = allFiles.findAll { file ->
        file.endsWith('.java')
    }.collect { file ->
        def relativePath = Paths.get(file).subpath(1, Paths.get(file).getNameCount()) // Adjust the subpath as necessary
        def absolutePath = projectRoot.resolve(relativePath).toFile()

        return absolutePath.exists() ? absolutePath : null
    }.findAll { it != null }

    return ratchetedFilesCache = allFiles
}


def configureCheckstyleTask(Checkstyle task, String sourceDir) {
    // For checkstyleFile task, the sources are set via -PfilePath parameter in task definition
    if (task.name == 'checkstyleFile') {
        if (!project.hasProperty('filePath')) {
            println "No filePath property provided. Skipping task ${task.name}"
            task.enabled = false
        } else {
            def filePaths = project.property('filePath').split(',').collect { it.trim() }
            task.source = project.files(filePaths)
        }
    } else {
        def ratchetedFiles = getFilteredFilesForCheckstyle(sourceDir)
        if (ratchetedFiles == null) {
            // No -PratchetFrom provided: leave the task's default (full) source set untouched.
        } else if (!ratchetedFiles.isEmpty()) {
            task.source = project.files(ratchetedFiles)
        } else {
            println "No changed files under ${sourceDir} relative to ratchetFrom. Skipping task ${task.name}."
            task.enabled = false
        }
    }

    task.classpath = project.files(
            sourceSets.main.output.classesDirs,
            sourceSets.main.output.resourcesDir
    )
    task.reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

def getFilteredFilesForCheckstyle(String sourceDir) {
    def files = getRatchetedFiles()
    if (files == null) {
        return null
    }
    return files.findAll { file ->
        def filePath = file.toPath().normalize()
        def isJavaFile = filePath.toString().endsWith('.java')
        def containsSourceSegment = filePath.toString().contains(sourceDir)

        isJavaFile && containsSourceSegment
    }
}


// Configure each Checkstyle task
tasks.withType(Checkstyle).configureEach { Checkstyle task ->
    def sourceDirMapping = [
            'checkstyleMain'           : 'src/main/java',
            'checkstyleTest'           : 'src/test/java',
            'checkstyleIntegrationTest': 'src/integrationTest/java',
            'checkstyleJmh'            : 'src/jmh/java',
            'checkstyleFuzzTest'       : 'src/fuzzTest/java',
            'checkstyleFile'           : ''
    ]

    sourceDirMapping.each { taskName, sourceDir ->
        if (task.name == taskName) {
            configureCheckstyleTask(task, sourceDir)
        }
    }

    task.dependsOn processResources
}

// jmh/integrationTest/fuzzTest are wired up later in this file (see sourceSets{}/testing{}
// below), which resets task.source after the configureEach block above runs. Re-applying the
// filter in a task.doFirst {} used to "win" that race, but doFirst runs at task EXECUTION
// time, after Gradle has already snapshotted task.source for its up-to-date check -- so the
// task's recorded inputs stay the full (unfiltered) source set forever, and a later run with a
// *different* -PratchetFrom value is wrongly reported UP-TO-DATE, serving a stale report from
// whatever scope happened to run first. project.afterEvaluate {} still runs during the
// CONFIGURATION phase (after all source-set wiring has settled, guaranteed by Gradle to
// complete before any task executes), so reassigning task.source here is seen by the
// up-to-date check like any other configuration-time input.
project.afterEvaluate {
    tasks.withType(Checkstyle).configureEach { Checkstyle task ->
        if (task.name in ['checkstyleJmh', 'checkstyleIntegrationTest', 'checkstyleFuzzTest']) {
            def relevantSourceDir = task.name == 'checkstyleJmh' ? 'src/jmh/java'
                    : task.name == 'checkstyleIntegrationTest' ? 'src/integrationTest/java'
                    : 'src/fuzzTest/java'
            def checkstyleFiles = getFilteredFilesForCheckstyle(relevantSourceDir)

            if (checkstyleFiles != null && !checkstyleFiles.isEmpty()) {
                task.source = project.files(checkstyleFiles)
            } else if (checkstyleFiles != null) {
                task.enabled = false
            }
        }
    }
}

configurations {
    jmh
}

sourceSets {
    jmh {
        java {
            srcDirs = ['src/jmh/java']
        }
        resources {
            srcDirs = ['src/jmh/resources']
        }
    }
    fuzzTest {
        java {
            srcDirs = ['src/fuzzTest/java']
        }
        resources {
            srcDirs = ['src/fuzzTest/resources']
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
            }
        }
    }
}

test {
    useJUnitPlatform()

    beforeTest { descriptor ->
        logger.lifecycle("Running test: ${descriptor}")
    }

    jvmArgs '-Xss32m', '-Xmx4G'

    testLogging {
        events "failed"
        exceptionFormat "short"
    }
    finalizedBy jacocoTestReport
}

integrationTest {
    dependsOn assemble

    beforeTest { descriptor ->
        logger.lifecycle("Running integration test: ${descriptor}")
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    sourceSets sourceSets.main, sourceSets.fuzzTest
}

task parallelTest(type: Test) {
    useJUnitPlatform()
    //increase heap memory
    jvmArgs '-Xss64m', '-Xmx4G'
    //stop build after the first failing test
    failFast = project.hasProperty("failFast")
    //option to use the half of the available cores (it can be increased but there is no too much difference)
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    //this is recommended in the docs, -> https://docs.gradle.org/current/userguide/performance.html#forking_options
    forkEvery = 750
    //save some time avoiding reports
    reports.html.required = false
    reports.junitXml.required = false
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
