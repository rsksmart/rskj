// Assembles the OpenRPC document from the fragments under doc/rpc, the same way the devportal sync
// does, so the document can also be produced with a single local command. A JavaExec over the main
// runtime classpath rather than `fatJar` + `java -cp`: this only needs compileJava instead of
// shading every dependency.
//
// The version defaults to the project version and can be overridden with -PrpcDocVersion=<version>,
// which is how CI passes the version it extracts from version.properties. Do not "fix" the x.y.z
// placeholder in doc/rpc/template.json -- the tool substitutes it from the required --version.
task genRpcDocs(type: JavaExec) {
    group = 'documentation'
    description = 'Assembles the OpenRPC JSON-RPC document from the fragments under doc/rpc'

    def docSourceDir = new File(rootDir, 'doc/rpc')
    def docOutputFile = new File(buildDir, 'rpc-docs/rskj-openrpc.json')
    def docVersion = (project.findProperty('rpcDocVersion') ?: project.version).toString()

    inputs.dir docSourceDir
    inputs.property 'rpcDocVersion', docVersion
    outputs.file docOutputFile

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'co.rsk.cli.tools.GenerateOpenRpcDoc'
    // -d takes the directory that directly contains template.json and methods/. Files at that
    // directory's root other than template.json -- undocumented.json -- are never read.
    args '--version', docVersion, '--dir', docSourceDir.toString(), '--outputFile', docOutputFile.toString()

    doFirst {
        docOutputFile.parentFile.mkdirs()
    }
}

task generateResources {
    def buildInfoFile = 'build-info.properties'

    doLast {
        def generatedDir = new File(buildDir, 'generatedResources')
        mkdir(generatedDir)
        def generated = new File(generatedDir, buildInfoFile)
        def commitHash = gitCommitHash()
        def currentBranch = gitCurrentBranch()
        generated.text = """
            build.hash=$commitHash
            build.branch=$currentBranch
            """
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

jar {
    dependsOn generateResources
    def commitHash = gitCommitHash()
    def currentBranch = gitCurrentBranch()
    manifest {
        attributes 'Git-Commit': commitHash,
                'Git-Branch': currentBranch
    }
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    from new File(buildDir, 'generatedResources') // Reference the generated resources directory
}

task generatePom(dependsOn: jar) {
    dependsOn generatePomFileForRskjPublication

    def jarName = jar.outputs.files.singleFile.name
    def pomFile = layout.buildDirectory.dir("${jarName.take(jarName.lastIndexOf('.'))}.pom").get().asFile
    ext.file = pomFile

    doLast {
        copy {
            from "$buildDir/publications/rskj/pom-default.xml"
            into pomFile.parentFile
            rename 'pom-default.xml', pomFile.name
        }
    }
}

task fatJar(type: Jar, dependsOn: jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': "$application.mainClass"
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class'

    for (def jar in configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }) {
        from(jar) {
            eachFile { details -> amendPathIfNeeded(details) }
        }
    }

    with jar
}

task jmhJar(type: Jar) {
    from sourceSets.jmh.output
    archiveClassifier = 'jmh'
}

task jmh(type: JavaExec) {
    doLast {
        mkdir "${buildDir}/reports/jmh"
    }

    classpath = sourceSets.jmh.runtimeClasspath

    // provide -PjmhArgs="<regular jmh parameters format>", ie: -PjmhArgs="-wi 5 -i 5 -f 1 -p suite=e2e -p host=http://localhost:4444 co.rsk.jmh.web3.BenchmarkWeb3"
    if (project.hasProperty('jmhArgs')) {
        mainClass = 'org.openjdk.jmh.Main'
        args(jmhArgs.split("\\s+"))
    }
    // provide predefined Benchmark Runner task and optionally other known parameters, ie: -Pbenchmark=BenchmarkWeb3E2ERunner -Phost=http://localhost:4444 -Pnetwork=regtest
    else if (project.hasProperty('benchmark')) {
        mainClass = "co.rsk.jmh.runners.${project.getProperty("benchmark")}"

        def customArgs = []

        if (project.hasProperty('host')) {
            customArgs << "-p" << "host=${project.getProperty("host")}"
        }

        if (project.hasProperty('config')) {
            customArgs << "-p" << "config=${project.getProperty("config")}"
        }

        args(customArgs)
    }

}

tasks.withType(Tar) {
    compression = Compression.GZIP
    archiveExtension.set('tar.gz')
}

artifacts {
    archives sourcesJar
    archives javadocJar
    archives jar
    archives(generatePom.file) {
        type 'text'
        builtBy generatePom
    }
    archives fatJar
    archives distTar
}

static def gitCurrentBranch() {
    return resolveGitValue("COMMIT_BRANCH", "git rev-parse --abbrev-ref HEAD")
}

static def gitCommitHash() {
    return resolveGitValue("COMMIT_HASH", "git rev-parse --short HEAD")
}

static def resolveGitValue(String envVar, String gitCommand) {
    def envValue = System.getenv(envVar)?.trim()
    if (envValue) return envValue
    try {
        def process = gitCommand.execute()
        process.waitFor()
        if (process.exitValue() == 0) {
            def result = process.text.trim()
            if (result) return result
        }
    } catch (Exception ignored) {}
    return "unknown"
}

static def amendPathIfNeeded(details) {
    def uPath = details.path.toUpperCase()
    if (uPath.startsWith("META-INF/LICENSE") || uPath.startsWith("META-INF/NOTICE")) {
        def originalFile = details.file as File
        def jarName = originalFile.parentFile.parentFile.name.split(".jar")[0]
        def newPath = originalFile.parentFile.name + "/" + jarName + "_" + originalFile.name
        details.path = newPath
    }
}

task checkstyleAll {
    group = 'Verification'
    description = 'Run all Checkstyle checks'
    dependsOn 'checkstyleMain', 'checkstyleTest', 'checkstyleJmh', 'checkstyleIntegrationTest', 'checkstyleFuzzTest'
}

task checkstyleFile(type: Checkstyle) {
    group = 'Verification'
    description = 'Run Checkstyle on specific file(s) (use -PfilePath=file1.java or -PfilePath=file1.java,file2.java)'
    maxWarnings = 0
}

task spotlessAll {
    group = 'Verification'
    description = 'Run all Spotless checks'
    dependsOn 'spotlessJavaCheck'
}
