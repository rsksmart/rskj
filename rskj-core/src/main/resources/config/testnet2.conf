blockchain.config {
    name = testnet2
    # testnet2 is a fresh network: all released hardforks activate at genesis (height 0) and
    # unreleased ones remain disabled (-1).
    hardforkActivationHeights = {
        bahamas = 0,
        afterBridgeSync = -1,
        orchid = 0,
        orchid060 = 0,
        wasabi100 = 0,
        twoToThree = 0,
        papyrus200 = 0,
        iris300 = 0,
        hop400 = 0,
        hop401 = 0,
        fingerroot500 = 0,
        arrowhead600 = 0,
        arrowhead631 = -1,
        # Lovell (RSKIP419 et al.) MUST be active: the powpeg-node's FederationWatcher calls the
        # Bridge's getProposedFederationAddress (RSKIP419-gated) every block. With Lovell disabled
        # that method is unregistered, the ABI decode fails, and no federation ever associates.
        lovell700 = 0,
        # Reed (RSKIP305 "bridge segwit-compatible") MUST be active: the powpeg builds a segwit
        # P2SH-P2WSH-ERP federation, so peg-out signing uses the BIP-143 sighash, which needs the
        # stored UTXO outpoint values gated behind RSKIP305 (reed800). With Reed disabled, the Bridge
        # throws "Can't call this method before RSKIP305 activation" on every addSignature and no
        # peg-out can ever be signed. The federation format and the hardfork level must be consistent.
        reed800 = 0,
        reed810 = -1,
        vetiver900 = -1,
        tbd1000 = -1
    },
    consensusRules = {
        rskip97 = -1, # disable orchid difficulty drop
        rskip132 = 0,
        rskip284 = 0,
        rskip290 = 0
    }
}

peer {

    discovery = {

        # if peer discovery is off
        # the peer window will show
        # only what retrieved by active
        # peer [true/false]
        enabled = false

        # List of the peers to start
        # the search of the online peers
        # values: [ip:port]
        # TODO: add testnet2 bootnodes before a shared/public launch.
        ip.list = []
    }

    # Port for server to listen for incoming connections
    port = 50505

    # Network id
    networkId = 8100
}

# the number of milliseconds that should pass from a previous submission of a mining solution before next one is allowed
# set this value to zero or any negative number to disable this limit
miner.server.workSubmissionRateLimitInMills = 10000 # 10 secs

# the folder resources/genesis contains several versions of genesis configuration according to the network the peer will run on
genesis = orchid-testnet2.json

database {
    # place to save physical storage files
    dir = ${user.home}/.rsk/testnet2/database
}

# hello phrase will be included in the hello message of the peer
hello.phrase = TestNet2

# account loaded when the node start.
wallet {
    enabled = false
    accounts = []
}

